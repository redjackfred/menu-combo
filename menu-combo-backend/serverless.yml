org: peiwen
app: menu-combo
service: menu-combo-backend

plugins:
  - serverless-offline

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  timeout: 30
  memorySize: 1024
  environment:
    BUCKET_NAME: menu-combo-uploads
    DB_SECRET_ARN: arn:aws:secretsmanager:us-east-1:024848456604:secret:menu-db-dZh6zJ
    CLAUDE_API_KEY: arn:aws:secretsmanager:us-east-1:024848456604:secret:menu-claude-api-key-PtNVh4
    SQS_QUEUE_URL: !Ref MenuOcrQueue
    OPENAI_MODEL: gpt-4o-mini  # Faster and cheaper than gpt-4o
  httpApi:
    cors:
      allowedOrigins:
        - https://menu-combo.peiwen.dev
        - http://localhost:5173
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowCredentials: true
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
          Resource: arn:aws:s3:::menu-combo-uploads/*

        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource:
            - arn:aws:secretsmanager:us-east-1:024848456604:secret:menu-db-*
            - arn:aws:secretsmanager:us-east-1:024848456604:secret:menu-claude-api-key-*

        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource: !GetAtt MenuOcrQueue.Arn

        - Effect: Allow
          Action:
            - textract:DetectDocumentText
          Resource: '*'

functions:
  api:
    handler: handler.handler
    events:
      - httpApi:
          path: /
          method: ANY
      - httpApi:
          path: /{proxy+}
          method: ANY
    timeout: 30

  ocrWorker:
    handler: ocrWorker.handler
    timeout: 300  # 5 minutes
    memorySize: 3008  # Increased for faster processing (more CPU)
    events:
      - sqs:
          arn: !GetAtt MenuOcrQueue.Arn
          batchSize: 1
          maximumConcurrency: 10  # SQS can trigger up to 10 Lambda instances in parallel

resources:
  Resources:
    MenuOcrQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: menu-ocr-queue
        VisibilityTimeout: 300
        MessageRetentionPeriod: 86400
        ReceiveMessageWaitTimeSeconds: 20
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt MenuOcrDLQ.Arn
          maxReceiveCount: 3

    MenuOcrDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: menu-ocr-dlq
        MessageRetentionPeriod: 1209600

